<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.95">
      <stop offset="0%" stop-color="#FFF6E8"/>
      <stop offset="70%" stop-color="#FFE3B8"/>
      <stop offset="100%" stop-color="#FFCE8B"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="bunOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5B85E"/>
      <stop offset="55%" stop-color="#E79A3D"/>
      <stop offset="100%" stop-color="#C97B2B"/>
    </linearGradient>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDD08F"/>
      <stop offset="100%" stop-color="#EEAE5B"/>
    </linearGradient>
    <linearGradient id="sos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2574A"/>
      <stop offset="45%" stop-color="#B93A37"/>
      <stop offset="100%" stop-color="#8A2328"/>
    </linearGradient>
    <linearGradient id="sosGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A82" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF9A82" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mustardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#F2B90E"/>
    </linearGradient>
    <linearGradient id="ketchupG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2262E"/>
      <stop offset="100%" stop-color="#A50F1E"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="36" fill="url(#bg)"/>
  <circle cx="96" cy="64" r="60" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="560" cy="90" r="80" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="520" cy="300" r="48" fill="#FFFFFF" opacity="0.18"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="322" rx="250" ry="30" fill="#7A4313" opacity="0.28" filter="url(#soft)"/>
  <ellipse cx="320" cy="318" rx="160" ry="20" fill="#6B3810" opacity="0.35" filter="url(#soft)"/>

  <!-- bun bottom -->
  <rect x="118" y="208" width="404" height="92" rx="44" fill="url(#bunOut)"/>
  <rect x="118" y="250" width="404" height="50" rx="25" fill="#C97B2A" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="320" cy="212" rx="196" ry="16" fill="url(#bunTop)" opacity="0.6"/>

  <!-- sausage -->
  <rect x="152" y="156" width="336" height="104" rx="50" fill="url(#sos)"/>
  <rect x="152" y="156" width="336" height="52" rx="50" fill="url(#sosGloss)"/>
  <!-- charred ends -->
  <ellipse cx="168" cy="208" rx="18" ry="52" fill="#601318" opacity="0.75"/>
  <ellipse cx="472" cy="208" rx="18" ry="52" fill="#601318" opacity="0.75"/>
  <!-- skin shine -->
  <ellipse cx="200" cy="180" rx="120" ry="12" fill="#FFFFFF" opacity="0.28" filter="url(#glow)"/>

  <!-- mustard zigzag -->
  <g fill="url(#mustardG)" stroke="#F2B90E" stroke-width="1">
    <path d="M178 196 q40 -22 80 0 q40 22 80 0 q40 -22 80 0 q40 22 80 0 q34 -18 60 -2 v14 q-26 -12 -56 2 q-38 22 -78 0 q-40 -22 -80 0 q-40 22 -80 0 q-38 -22 -78 0 q-32 14 -52 2 z"/>
    <polygon points="312,162 322,160 316,170"/>
  </g>
  <path d="M196 190 q30 -10 60 0 M336 176 q30 -10 60 0" stroke="#FDDC6C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- ketchup drips -->
  <g fill="url(#ketchupG)">
    <path d="M224 258 q10 -26 16 -6 q4 14 -2 24 q-8 6 -12 -4 q-6 -8 -2 -14z"/>
    <path d="M400 258 q10 -30 16 -8 q5 16 -2 26 q-8 7 -12 -3 q-6 -8 -2 -15z"/>
    <path d="M306 182 q26 -14 26 2 q0 10 -16 14 q-14 -2 -16 -10 q2 -4 6 -6z"/>
  </g>
  <ellipse cx="230" cy="272" rx="20" ry="5" fill="#8F0E1B" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="376" cy="274" rx="24" ry="5" fill="#8F0E1B" opacity="0.4" filter="url(#soft)"/>

  <!-- bun top folding over -->
  <rect x="130" y="196" width="380" height="70" rx="36" fill="url(#bunTop)"/>
  <rect x="130" y="196" width="380" height="26" rx="36" fill="#FFFFFF" opacity="0.28"/>
  <path d="M150 214 q170 26 340 0" stroke="#D98B36" stroke-width="5" fill="none" opacity="0.5"/>
  <ellipse cx="320" cy="208" rx="250" ry="14" fill="#8A4E16" opacity="0.32" filter="url(#soft)"/>

  <!-- sesames -->
  <g fill="#FFF1D0">
    <ellipse cx="210" cy="206" rx="9" ry="5.5" transform="rotate(-12 210 206)"/>
    <ellipse cx="330" cy="200" rx="9" ry="5.5" transform="rotate(8 330 200)"/>
    <ellipse cx="380" cy="212" rx="9" ry="5.5" transform="rotate(-6 380 212)"/>
    <ellipse cx="272" cy="214" rx="8" ry="5" transform="rotate(14 272 214)"/>
    <ellipse cx="160" cy="214" rx="8" ry="5" transform="rotate(6 160 214)"/>
    <ellipse cx="428" cy="210" rx="8" ry="5" transform="rotate(-14 428 210)"/>
  </g>
</svg>